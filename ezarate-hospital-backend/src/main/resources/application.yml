spring:
  application:
    name: hospital-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway, not Hibernate auto-generation
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 25MB     # encounter files / lab attachments
      max-request-size: 25MB

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:}          # set in env, never commit a real value
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    # Replaces Supabase Storage buckets ("patient-photos", "lab-order-files")
    # — each becomes a subfolder under this root. See FileStorageService.
    base-dir: ${APP_STORAGE_DIR:./storage}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
